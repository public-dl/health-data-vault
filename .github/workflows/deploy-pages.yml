name: Deploy Health Data Vault to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  theme-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc -p e2e/tsconfig.json
      - run: npx playwright test e2e/themes.spec.ts e2e/navigation-delivery.spec.ts e2e/public-copy-privacy.spec.ts e2e/examination-states.spec.ts e2e/condition-history.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-smoke-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
  deploy:
    needs: theme-smoke
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          CONTEXT: production
          PUBLIC_SITE_URL: https://public-dl.github.io/health-data-vault
          PUBLIC_GA4_ENABLED: 'true'
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
