[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-data-vault"
version = "0.1.0"
description = "Traceable Niigata public health data ingestion"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
hdv = "hdv.__main__:main"

[tool.setuptools.packages.find]
include = ["hdv*"]

[tool.setuptools.package-data]
hdv = ["config/*.json"]
